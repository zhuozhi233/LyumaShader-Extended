name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: false
          body: |
            VPM/VCC 软件包。

            > [!IMPORTANT]
            > 从 1.x 升级时，直接安装最新版 2.x，再通过 `Tools > LyumaShader Extended > 从 1.x 升级到 2.x` 迁移旧模型。升级前不要求执行一键还原或删除旧版生成资源。

            - 新增 2D 轮廓控制，可在全局或每个材质中分别决定进入 2D 后是否保留轮廓，3D 状态不受影响
            - 单材质的 2D 强度、朝向、锁定 2D 轴、Z 深度修正和 2D 轮廓均可逐项选择使用全局设置或独立设置
            - lilToon、lilToon Custom Shader 与 Poiyomi 的 Waifu2d 材质面板新增“启用 2D 轮廓”开关
            - 已转换的旧版 Waifu2d 着色器会在再次处理时自动补齐新的轮廓控制
            - ZIP 根目录包含 package.json，可直接通过 VCC 安装
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
