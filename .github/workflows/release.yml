name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            VPM/VCC 软件包。

            > [!IMPORTANT]
            > 从 1.x 升级时，直接安装 2.0.1，再通过 `Tools > LyumaShader Extended > 从 1.x 升级到 2.x` 迁移旧模型。升级前不要求执行一键还原或删除旧版生成资源。

            - 基于 NDMF 在构建副本中转换材质、生成动画并修复网格，不直接修改源材质与控制器
            - 支持逐材质启用和独立 2D 参数；材质列表增加搜索、分页和分类缓存
            - 官方 lilToon 与 Poiyomi 默认启用；第三方变体着色器需要经过两次风险确认
            - 新增独立的 1.x → 2.x 迁移工具，保留逐材质参数、Root Bone 与普通网格修复状态；旧动画由 NDMF 重新生成
            - 2D 开关支持自定义名称、图标，并可安装到 MA 子菜单、Menu Group 或 Menu Installer 目标
            - Root Bone、MA Mesh Settings 与普通 MeshRenderer 修复在 NDMF 构建副本中执行
            - ZIP 根目录包含 package.json，可直接通过 VCC 安装
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
