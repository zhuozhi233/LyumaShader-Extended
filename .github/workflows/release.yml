name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: false
          body: |
            VPM/VCC 软件包。

            > [!IMPORTANT]
            > 从 1.x 升级时，直接安装最新版 2.x，再通过 `Tools > LyumaShader Extended > 从 1.x 升级到 2.x` 迁移旧模型。升级前不要求执行一键还原或删除旧版生成资源。

            - 游戏内 2D 菜单改为可添加多个自定义菜单项，可分别设置名称、图标、安装位置、参数和默认、保存、同步状态
            - 每个菜单项可独立设置 2D 强度、朝向、锁定轴、Z 深度修正、剖面跟随相机和 2D 轮廓
            - 生成的 BlendTree 改为嵌套优先级结构；多个菜单同时开启时，列表中靠后的项目完整覆盖靠前项目，避免参数叠加冲突
            - 每个菜单动画写入完整 2D 状态，修复切换菜单时参数残留和剖面跟随相机状态未正确恢复
            - 材质规则中的独立参数不再被菜单动画覆盖，仍使用全局设置的其他参数继续受菜单控制
            - 修复 lilToon Fur 在压平后仍沿深度方向膨胀造成的毛发厚度不一致和穿插
            - 修复菜单项目移动后名称显示重复，并改善窄窗口下的配置布局和点击区域
            - ZIP 根目录包含 package.json，可直接通过 VCC 安装
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
