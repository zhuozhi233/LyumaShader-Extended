name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            VPM/VCC 软件包。

            > [!IMPORTANT]
            > 从 1.x 升级时，直接安装最新版 2.x，再通过 `Tools > LyumaShader Extended > 从 1.x 升级到 2.x` 迁移旧模型。升级前不要求执行一键还原或删除旧版生成资源。

            - 默认保护粒子材质，避免 `ParticleSystemRenderer` 使用 Waifu2d 后前后位置被压到世界原点
            - 粒子独占的材质会跳过 Waifu2d 转换
            - 粒子与普通网格共享材质时，会在构建阶段为粒子生成不带 2D 的独立副本
            - 生成 2D 开关动画时会排除受保护的粒子渲染器
            - 可在构建设置中关闭“保护粒子材质”，恢复原有处理方式
            - ZIP 根目录包含 package.json，可直接通过 VCC 安装
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
