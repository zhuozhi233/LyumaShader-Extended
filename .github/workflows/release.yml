name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            VPM/VCC 测试版软件包。

            - 新增基于 NDMF 的非破坏式 Waifu2d 配置，构建时转换副本，不再直接修改源材质、动画或控制器
            - 支持逐材质启用、独立 2D 参数、材质搜索，以及自定义开关菜单的名称、图标和安装位置
            - 扫描 Renderer、动画换材质与 MA 组件引用，构建时处理关联材质和材质变体
            - 官方 lilToon 与 Poiyomi 默认启用；第三方变体着色器改为手动确认后启用，并明确提示兼容风险
            - Root Bone、MA Mesh Settings 与普通 MeshRenderer 修复迁移到 NDMF 构建副本
            - 高级设置保留旧版“转换已扫描材质”和“还原已扫描材质”，用于兼容未使用 NDMF 的模型
            - ZIP 根目录包含 package.json，可直接通过 VCC 安装
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
