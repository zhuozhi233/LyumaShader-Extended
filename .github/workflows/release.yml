name: 构建 VPM Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.lyumashader-extended"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json 版本 $PACKAGE_VERSION 与标签版本 ${{ steps.version.outputs.version }} 不一致"
            exit 1
          fi

      - name: 构建 VPM ZIP
        shell: bash
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore" "release/*"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "LyumaShader 扩展版 ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: false
          body: |
            ### 新增

            - Root Bone 修复新增“稳定锚点”模式，并设为默认选项；构建时在 Avatar 根目录创建不受骨骼动画影响的统一 Root Bone
            - 保留原有 Hips 修复模式，可在构建设置中自由切换

            ### 修复

            - 修复更换 Root Bone 后 Bounds 空间不一致的问题，同步处理蒙皮网格、普通网格转换结果及全部 MA Mesh Settings
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json
